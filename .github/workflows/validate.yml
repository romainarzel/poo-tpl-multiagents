name: Java validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: java-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Java 21
        # actions/setup-java v5.6.0
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
      - name: Report toolchain
        run: |
          java -version
          javac -version
          make --version
      - name: Compile all sources
        run: make build
      - name: Run GUI-free regression check
        run: java -ea -cp 'bin:lib/gui.jar' cellularSim.CellularEngineTest
      - name: Generate Javadoc without launching a browser
        run: make javadoc-headless
