name: Java validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile all sources
        run: make build
      - name: Run GUI-free regression check
        run: java -ea -cp 'bin:lib/gui.jar' cellularSim.CellularEngineTest
      - name: Generate Javadoc without launching a browser
        run: make javadoc-headless
